<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIFit AR - Select Price</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', 'Kanit', sans-serif; background: linear-gradient(160deg, #EEF2FF 0%, #F0FBFF 50%, #F5F0FF 100%); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        body::before { content: ''; position: fixed; bottom: -100px; right: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 70%); border-radius: 50%; pointer-events: none; z-index: 0; }
        header { padding: 20px 6%; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.6); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(79,126,245,0.15); position: relative; z-index: 10; }
        header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #4F7EF5, #8B5CF6, #06B6D4, transparent); }
        .logo { background: linear-gradient(135deg, #3B5FDB, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-size: 22px; font-weight: 700; }
        .badge { padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.8); color: #4F7EF5; border: 1px solid rgba(79,126,245,0.2); }
        .nav-bar { padding: 12px 6%; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #5B6490; font-size: 13px; font-weight: 500; background: rgba(255,255,255,0.4); backdrop-filter: blur(6px); border-bottom: 1px solid rgba(79,126,245,0.05); position: relative; z-index: 5; transition: color 0.2s; }
        .nav-bar:hover { color: #4F7EF5; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 20px 6%; position: relative; z-index: 1; }
        .text-group { text-align: center; }
        .text-group h2 { color: #1A1F4E; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .text-group p { color: #5B6490; font-size: 14px; }

        /* Price cards */
        .price-options { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
        .price-card {
            background: rgba(255,255,255,0.88);
            border: 1.5px solid rgba(79,126,245,0.1);
            border-radius: 14px; padding: 14px 20px;
            text-align: center; cursor: pointer; transition: all 0.2s;
            font-size: 15px; font-weight: 500; color: #3B4A8A;
            backdrop-filter: blur(8px);
        }
        .price-card:hover { border-color: rgba(79,126,245,0.3); transform: translateX(4px); box-shadow: 0 4px 16px rgba(79,126,245,0.1); }
        .price-card.active {
            border-color: #4F7EF5;
            background: linear-gradient(135deg, rgba(79,126,245,0.1), rgba(139,92,246,0.08));
            color: #1A1F4E; font-weight: 600;
            box-shadow: 0 4px 16px rgba(79,126,245,0.18);
            transform: translateX(4px);
        }
        .price-card.active::before { content: '✓  '; color: #4F7EF5; }

                /* ── SHARED BUTTON ── */
        .btn-primary {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, #4F7EF5, #7B5CF6);
            color: white; border: none;
            padding: 15px 28px; border-radius: 16px;
            font-size: 16px; font-weight: 600; font-family: 'Outfit', sans-serif;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(79,126,245,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .btn-primary::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent); pointer-events: none; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(79,126,245,0.45), inset 0 1px 0 rgba(255,255,255,0.15); }
        .btn-primary:active { transform: translateY(0); }

        footer { position: relative; background: rgba(255,255,255,0.5); backdrop-filter: blur(8px); border-top: 1px solid rgba(79,126,245,0.1); padding: 16px; text-align: center; color: #8892B5; font-size: 11px; font-weight: 500; z-index: 1; }
    </style>
</head>
<body>
    <header>
        <div class="logo">SabyeTeen</div>
        <div class="badge">✨ Gemini &nbsp;🔥 Firebase</div>
    </header>
    <div class="nav-bar" onclick="window.history.back()">◀ ย้อนกลับ</div>
    <main>
        <div class="text-group">
            <h2>งบประมาณของคุณ</h2>
            <p>เลือกช่วงราคาเพื่อให้ AI แนะนำได้แม่นยำขึ้น</p>
        </div>
        <div class="price-options">
            <div class="price-card" onclick="selectPrice(this)">ต่ำกว่า 2,000 บาท</div>
            <div class="price-card" onclick="selectPrice(this)">2,000 - 4,000 บาท</div>
            <div class="price-card active" onclick="selectPrice(this)">4,000 - 6,000 บาท</div>
            <div class="price-card" onclick="selectPrice(this)">6,000 บาทขึ้นไป</div>
        </div>
        <button class="btn-primary" onclick="location.href='rec.html'">วิเคราะห์ผลลัพธ์ →</button>
    </main>
    <footer>Computer Science, RMUTT | © 2026 ShoeSpace Project</footer>
    <script>
        function selectPrice(el) {
            document.querySelectorAll('.price-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
