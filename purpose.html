<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIFit AR - Select Purpose</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', 'Kanit', sans-serif; background: linear-gradient(160deg, #EEF2FF 0%, #F0FBFF 50%, #F5F0FF 100%); min-height: 100vh; display: flex; flex-direction: column; }
        body::before { content: ''; position: fixed; top: -120px; right: -120px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(139,92,246,0.1) 0%, transparent 70%); border-radius: 50%; pointer-events: none; z-index: 0; }
        header { padding: 20px 6%; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.6); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(79,126,245,0.15); position: relative; z-index: 10; }
        header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #4F7EF5, #8B5CF6, #06B6D4, transparent); }
        .logo { background: linear-gradient(135deg, #3B5FDB, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-size: 24px; font-weight: 700; }
        .tech-badges { display: flex; gap: 8px; }
        .badge { padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-gemini { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
        .badge-firebase { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #991b1b; }
        .nav-bar { padding: 12px 6%; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #5B6490; font-size: 13px; font-weight: 500; background: rgba(255,255,255,0.4); backdrop-filter: blur(6px); border-bottom: 1px solid rgba(79,126,245,0.05); position: relative; z-index: 5; transition: color 0.2s; }
        .nav-bar:hover { color: #4F7EF5; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 6%; gap: 28px; position: relative; z-index: 1; }
        .section-title { color: #1A1F4E; font-size: 24px; font-weight: 700; text-align: center; }

        /* Purpose cards */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; width: 100%; max-width: 720px; }
        .purpose-card {
            background: rgba(255,255,255,0.88);
            border: 1.5px solid rgba(79,126,245,0.1);
            border-radius: 20px; padding: 28px 16px;
            text-align: center; cursor: pointer; transition: all 0.25s;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(79,126,245,0.05);
        }
        .purpose-card:hover { border-color: rgba(79,126,245,0.35); transform: translateY(-5px); box-shadow: 0 12px 28px rgba(79,126,245,0.12); }
        .purpose-card.active {
            border-color: #4F7EF5;
            background: linear-gradient(145deg, rgba(224,234,255,0.95), rgba(237,229,255,0.88));
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(79,126,245,0.2);
        }
        .card-icon { font-size: 40px; margin-bottom: 12px; }
        .card-title { font-size: 15px; font-weight: 600; color: #1A1F4E; }
        .purpose-card.active .card-title { color: #4F7EF5; }

        /* ── MODERN BUTTONS ── */
                        /* ── SHARED BUTTON ── */
        .btn-primary {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, #4F7EF5, #7B5CF6);
            color: white; border: none;
            padding: 15px 28px; border-radius: 16px;
            font-size: 16px; font-weight: 600; font-family: 'Outfit', sans-serif;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(79,126,245,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .btn-primary::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent); pointer-events: none; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(79,126,245,0.45), inset 0 1px 0 rgba(255,255,255,0.15); }
        .btn-primary:active { transform: translateY(0); }

        footer { position: relative; background: rgba(255,255,255,0.5); backdrop-filter: blur(8px); border-top: 1px solid rgba(79,126,245,0.1); padding: 16px; text-align: center; color: #8892B5; font-size: 11px; font-weight: 500; z-index: 1; }
    </style>
</head>
<body>
    <header>
        <div class="logo">SabyeTeen</div>
        <div class="tech-badges">
            <span class="badge badge-gemini">✨ Gemini</span>
            <span class="badge badge-firebase">🔥 Firebase</span>
        </div>
    </header>
    <div class="nav-bar" onclick="window.history.back()">◀ ย้อนกลับ</div>
    <main>
        <div class="section-title">คุณต้องการรองเท้าสำหรับอะไร?</div>
        <div class="card-grid">
            <div class="purpose-card" onclick="selectPurpose(this)">
                <div class="card-icon">🏃‍♂️</div>
                <div class="card-title">วิ่ง / กีฬา</div>
            </div>
            <div class="purpose-card" onclick="selectPurpose(this)">
                <div class="card-icon">👟</div>
                <div class="card-title">ใส่เที่ยว / ไลฟ์สไตล์</div>
            </div>
            <div class="purpose-card" onclick="selectPurpose(this)">
                <div class="card-icon">🏋️‍♂️</div>
                <div class="card-title">ฟิตเนส / เทรนนิ่ง</div>
            </div>
        </div>
        <button class="btn-primary" onclick="window.location.href='price.html'">ถัดไป →</button>
    </main>
    <footer>Computer Science, RMUTT | © 2026 ShoeSpace Project</footer>
    <script>
        function selectPurpose(el) {
            document.querySelectorAll('.purpose-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
